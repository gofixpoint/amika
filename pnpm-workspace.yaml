packages:
  - "js/*"
  - "eslint-rules"

# `sdk/typescript` is deliberately NOT a member. It is a self-contained pnpm
# workspace with its own pnpm-workspace.yaml, its own pnpm-lock.yaml, and its
# own `packageManager` pin, and both `sdk-typescript.yml` and the OIDC publish
# workflow install from that lockfile. Absorbing it here would orphan it.

# pnpm 11 replaced `onlyBuiltDependencies` with an explicit per-package map.
# These values preserve pnpm 10's behavior exactly: esbuild's install scripts
# ran, everything else's did not. protobufjs is new to the list only because
# pnpm 11 now names every package it skips.
allowBuilds:
  esbuild: true
  protobufjs: false

# amika-hostd embeds the newest smolmachines (smolvm's engine) release, which
# is younger than pnpm's release-age gate. Drop these once it is a week old.
minimumReleaseAgeExclude:
  - smolmachines-darwin-arm64@1.22.2
  - smolmachines-linux-arm64-gnu@1.22.2
  - smolmachines-linux-x64-gnu@1.22.2
  - smolmachines@1.22.2

# Moved from the root package.json's `pnpm` field, which pnpm 11 no longer
# reads. Pins transitive deps: some below the 7-day package-age gate in CI,
# others up onto a patched release when the direct dependent still asks for a
# vulnerable range.
overrides:
  "@bufbuild/protobuf": "2.13.0"
  "@grpc/grpc-js": "1.14.5"
  "@opentelemetry/instrumentation-http": "0.222.0"
  axios: "1.20.0"
  brace-expansion@1: "1.1.21"
  brace-expansion@5: "5.0.12"
  esbuild: "0.28.1"
  follow-redirects: "1.16.3"
  # 13.0.7 backports the GHSA-3g3m-2fjr-6pw4 fix, which the advisory lists
  # only for 14.0.2.
  glob@13: "13.0.7"
  hono: "4.13.18"
  js-yaml: "4.3.2"
  shell-quote: "1.11.0"
  source-map-js: "1.2.2"
  undici: "7.30.2"
  # e2b takes undici 8 through an `undici8` npm alias, which the `undici` key
  # does not match.
  undici8: "npm:undici@8.12.4"
