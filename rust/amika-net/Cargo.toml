[package]
name = "amika-net"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Spike prototype: SSH and TCP streams to Amika hosts over iroh"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
iroh = { version = "1.4.1", features = ["unstable-net-report"] }
iroh-services = "2.0.0"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
