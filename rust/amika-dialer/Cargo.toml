[package]
name = "amika-dialer"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Turns amika.run requests from the reverse proxy into iroh streams to hosts"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = { version = "1.4.1", features = ["unstable-net-report"] }
iroh-services = "2.0.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
