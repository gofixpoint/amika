name: ssh and scp cannot honor --output, but enforce that differently
steps:
  - name: sandbox --output json ssh is rejected (amika's flag precedes the subcommand)
    cmd: [rig, --output, json, ssh, somebox]
    env:
      AMIKA_API_KEY: fake-test-key
      AMIKA_API_URL: http://192.0.2.1:81
    expect:
      exit: 1
      stderr_contains: "the --output flag is not supported by this command: it runs an underlying shell utility (ssh/scp) that streams its own output and cannot emit JSON"

  - name: sandbox -o json-pretty ssh is rejected too
    cmd: [rig, -o, json-pretty, ssh, somebox]
    env:
      AMIKA_API_KEY: fake-test-key
      AMIKA_API_URL: http://192.0.2.1:81
    expect:
      exit: 1
      stderr_contains: "the --output flag is not supported by this command"

  - name: rig ssh with no --output at all reaches the ordinary auth check instead
    # Contrast case: omitting --output entirely means Changed() is false, so
    # RejectFlag never fires, and (with no credentials at all) the command
    # fails at the normal "not logged in" auth gate instead.
    cmd: [rig, ssh, somebox]
    env:
      AMIKA_API_KEY: ""
    expect:
      exit: 1
      stderr_contains: 'not logged in; run "amika auth login"'

  - name: scp --output json is rejected (long form is unambiguously amika's flag)
    # scp sets DisableFlagParsing, so the global --output never reaches cobra
    # to be marked Changed. runSCPV2 rejects the long form explicitly via
    # output.RejectFlagInArgs before any resolution or exec.
    cmd: [scp, --output, json, a, b]
    expect:
      exit: 1
      stderr_contains: "the --output flag is not supported by this command"

  - name: scp --output=json is rejected too
    cmd: [scp, --output=json, a, b]
    expect:
      exit: 1
      stderr_contains: "the --output flag is not supported by this command"

  - name: the long form is rejected in the global-prefix position too (amika --output json scp ...)
    # RejectFlagInArgs scans the raw argv, so the unambiguous long --output is
    # rejected wherever it sits, before or after the scp subcommand.
    cmd: [--output, json, scp, a, b]
    expect:
      exit: 1
      stderr_contains: "the --output flag is not supported by this command"

  - name: scp with no operands at all fails cobra's arg-count check first
    cmd: [scp]
    expect:
      exit: 1
      stderr_contains: "requires at least 1 arg(s)"

  - name: scp forwards short options without requiring a rig
    cmd: [scp, --print, -o, StrictHostKeyChecking=yes, a, b]
    expect:
      exit: 0
      stdout_contains: "scp -o StrictHostKeyChecking=yes a b"
