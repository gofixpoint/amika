# Offline case: argument/usage validation errors and --help, none of which
# need Docker, network, or credentials.
name: argument and usage errors are reported clearly offline
steps:
  - name: a missing required positional argument fails with cobra's arg-count error
    cmd: [rig, delete]
    expect:
      exit: 1
      stderr_contains: "requires at least 1 arg(s), only received 0"

  - name: an unrecognized subcommand under a command GROUP does not error
    # This is a real, verified cobra quirk (not an Amika bug): cobra's
    # "unknown command" check (legacyArgs) only fires for the ROOT command.
    # For any non-root command that has subcommands but no Run/RunE of its
    # own (every "amika <group>" command here), an unrecognized trailing
    # word like "bogus" is treated as leftover args to a non-runnable
    # command, which cobra resolves by printing that group's help and
    # exiting 0 — no error, no stderr output. Contrast with the root-level
    # case just below.
    cmd: [rig, bogus]
    expect:
      exit: 0
      stdout_contains: "Available Commands"

  - name: an unrecognized subcommand at the ROOT is rejected
    # Unlike the nested-group case above, the root command (which has no
    # parent) does run cobra's legacyArgs "unknown command" check.
    cmd: [bogus-command]
    expect:
      exit: 1
      stderr_contains: 'unknown command "bogus-command" for "amika"'

  - name: amika --help exits 0 and lists top-level commands
    cmd: [--help]
    expect:
      exit: 0
      stdout_contains: "Available Commands"

  - name: amika rig code --help exits 0 and shows its own usage line
    cmd: [rig, code, --help]
    expect:
      exit: 0
      stdout_contains: "amika rig code <name> [flags]"

  - name: rig --help lists ssh and code
    cmd: [rig, --help]
    expect:
      exit: 0
      stdout_contains: "  ssh         SSH into a remote sandbox"

  - name: rig --help does NOT list the superseded sshv1
    # sshv1/codev1 stay registered for existing scripts but are Hidden, so the
    # help listing must steer new users to the current transport.
    cmd: [rig, --help]
    expect:
      exit: 0
      stdout_not_contains: "sshv1"

  - name: rig --help does NOT list the superseded codev1
    cmd: [rig, --help]
    expect:
      exit: 0
      stdout_not_contains: "codev1"

  - name: amika --help does NOT list the superseded scpv1
    cmd: [--help]
    expect:
      exit: 0
      stdout_not_contains: "scpv1"

  - name: hidden rig sshv1 --help still works and keeps its own flags
    # The compatibility promise: a script that called the old provider-native
    # ssh keeps working under the new name, flags included.
    cmd: [rig, sshv1, --help]
    expect:
      exit: 0
      stdout_contains: "amika rig sshv1 [flags] <name> [-- <command>...]"

  - name: hidden rig sshv1 --help still documents --revoke
    cmd: [rig, sshv1, --help]
    expect:
      exit: 0
      stdout_contains: "--revoke"

  - name: rig ssh --help defines no flags of its own
    # ssh forwards everything after the subcommand to the ssh binary, so
    # sshv1's --revoke must NOT be one of its flags.
    cmd: [rig, ssh, --help]
    expect:
      exit: 0
      stdout_not_contains: "--revoke"

  - name: hidden rig codev1 --help still works
    cmd: [rig, codev1, --help]
    expect:
      exit: 0
      stdout_contains: "amika rig codev1 <name> [flags]"

  - name: hidden scpv1 --help still works
    cmd: [scpv1, --help]
    expect:
      exit: 0
      stdout_contains: "amika scpv1 <source> ... <target>"
