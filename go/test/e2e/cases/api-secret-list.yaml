# Real-API case: read-only, does not create/mutate any resource.
#
# NOTE: there is no top-level `amika secret list` command. The generic
# ListSecretsResponse/SecretSummary schemas describe GET /api/v0beta1/secrets,
# which the CLI only calls internally (for dedup in `secret extract`/`secret
# push`); it has no direct read-only CLI surface. The nearest read-only list
# commands are `secret claude list` and `secret codex list`
# (GET /api/v0beta1/secrets/<provider>), whose items match the documented
# ListCredentialsResponse schema (array of {id, name, type, scope}) exactly.
name: secret provider list against the real API is read-only and well-formed
steps:
  - name: secret claude list -o json returns an array matching ListCredentialsResponse
    cmd: [secret, claude, list, -o, json]
    expect:
      exit: 0
      schema: ListCredentialsResponse

  - name: secret claude list (text) prints an ID/NAME/TYPE table
    cmd: [secret, claude, list]
    expect:
      exit: 0
      stdout_contains: "ID"

  - name: secret codex list -o json returns an array matching ListCredentialsResponse
    cmd: [secret, codex, list, -o, json]
    expect:
      exit: 0
      schema: ListCredentialsResponse

  - name: secret codex list (text) reports no credentials found
    cmd: [secret, codex, list]
    expect:
      exit: 0
      stdout_contains: "No Codex credentials found."
