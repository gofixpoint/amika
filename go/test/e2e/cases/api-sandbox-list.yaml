# Real-API case: read-only, does not create/mutate any resource.
# Lists sandboxes in the authenticated org via GET /api/v0beta1/sandboxes.
name: sandbox list against the real API is read-only and well-formed
steps:
  - name: sandbox list -o json returns an array matching ListSandboxesResponse
    cmd: [sandbox, list, -o, json]
    expect:
      exit: 0
      schema: ListSandboxesResponse

  - name: sandbox list -o json-pretty is valid pretty-printed JSON of the same shape
    cmd: [sandbox, list, -o, json-pretty]
    expect:
      exit: 0
      schema: ListSandboxesResponse

  # No stdout assertion here: against a clean org `sandbox list` prints
  # "No sandboxes found." instead of the NAME/STATE header, so asserting the
  # header would fail on an empty account. Assert only that the text path
  # exits cleanly, which holds for both empty and populated lists.
  - name: sandbox list (text) exits cleanly regardless of account state
    cmd: [sandbox, list]
    expect:
      exit: 0
