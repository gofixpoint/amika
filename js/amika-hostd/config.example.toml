# amika-hostd configuration.
#
# Settings here can be overridden by environment variables and flags. Keep this
# file readable only by you (chmod 600).

# This host's name in your Amika organization. Changing it registers a new host.
# Lowercase letters, digits, hyphens, and dots.
# hostname = "my-host"

# Where `amika-hostd setup` keeps this host's secrets: the Amika API key, and
# the secret key that authenticates Amika's requests to this daemon. By
# default they live in the system keychain (the macOS login keychain, or the
# Secret Service on a Linux desktop), and setup refuses on a machine without
# one, such as a server with no desktop session.
# Set "file" to keep them in plain files only you can read instead: the API key
# in ~/.config/amika-hostd/api-key, and the secret key in this file as
# secret_key.
# Environment: AMIKA_HOSTD_SECRET_STORE
# secret_store = "keychain"

api_url = "https://app.amika.dev"

# The address the daemon listens on. Expose it to Amika through a tunnel and
# run `amika-hostd register-url <public-url>`.
host = "127.0.0.1"
port = 3020

# --- Rig sizes ----------------------------------------------------------------
#
# The sizes rigs on this host can use. Amika's sizes for this host are replaced
# with these on every `up`. memory_gib can be fractional (0.5); vcpus is 1-16.
# Add `disk_grow_only = true` to a size if its disk can end up larger than
# disk_gib, so Amika shows disk_gib as a minimum.

[sizes.tiny]
vcpus = 1
memory_gib = 2
disk_gib = 10

[sizes.small]
vcpus = 2
memory_gib = 4
disk_gib = 16

[sizes.medium]
vcpus = 4
memory_gib = 8
disk_gib = 24

[sizes.large]
vcpus = 8
memory_gib = 16
disk_gib = 40

[sizes.xlarge]
vcpus = 16
memory_gib = 24
disk_gib = 40

# --- Preset images ------------------------------------------------------------
#
# The image each Amika preset boots on this host. `:latest` follows each
# release; pin a 12-character commit SHA instead to hold a version still.
# smolvm caches a pulled image in the VM, so `:latest` can lag a release.

[preset_images]
amika-coder = "ghcr.io/gofixpoint/amika-coder:latest"
amika-coder-plus-docker = "ghcr.io/gofixpoint/amika-coder-plus-docker:latest"
