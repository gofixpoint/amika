name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # go.mod's `go` line is the toolchain floor, so CI and releases
          # build with exactly the patched version it names.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Record Go version
        run: go version

      - name: Check formatting
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

  # This repo owns `@amika/sandbox`, so this job answers "is this package
  # correct". amika-mono consumes it as a git submodule pinned to an exact
  # commit and does not duplicate these tests; its CI answers the separate
  # question of whether the pinned version still satisfies its consumers.
  check-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: "22.23.4"
          cache: pnpm

      - name: Record Node.js and pnpm versions
        run: node --version && pnpm --version

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  # `@amika/service-auth`, which `@amika/sandbox` and amika-hostd depend on.
  check-service-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/service-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Record Node.js and pnpm versions
        run: node --version && pnpm --version

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  # `@amika/tunnel-protocol`, the tunnel framing amika-hostd and amika-mono's
  # gateway relay both speak.
  check-tunnel-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/tunnel-protocol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Record Node.js and pnpm versions
        run: node --version && pnpm --version

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  check-eslint-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eslint-rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: "22.23.4"
          cache: pnpm

      - name: Record Node.js and pnpm versions
        run: node --version && pnpm --version

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Test
        run: pnpm run test
  
  check-amika-hostd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/amika-hostd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: pnpm
      - name: Record Node.js and pnpm versions
        run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run formatcheck
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
