name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

  # This repo owns `@amika/sandbox`, so this job answers "is this package
  # correct". amika-mono consumes it as a git submodule pinned to an exact
  # commit and does not duplicate these tests; its CI answers the separate
  # question of whether the pinned version still satisfies its consumers.
  check-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  check-eslint-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eslint-rules
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Test
        run: pnpm run test
