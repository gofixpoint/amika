name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: make fmtcheck

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

  # This repo owns `@amika/sandbox`, so this job answers "is this package
  # correct". amika-mono consumes it as a git submodule pinned to an exact
  # commit and does not duplicate these tests; its CI answers the separate
  # question of whether the pinned version still satisfies its consumers.
  check-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  # `@amika/service-auth`, which `@amika/sandbox` and amika-hostd depend on.
  check-service-auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/service-auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Format check
        run: pnpm run formatcheck

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

  check-eslint-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eslint-rules
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # pnpm 11 requires node >=22.13; it aborts on 20 with
          # ERR_UNKNOWN_BUILTIN_MODULE before it can even print its version.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Test
        run: pnpm run test
  
  check-amika-hostd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/amika-hostd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run formatcheck
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
