name: Release

# Publishes a GitHub Release for a component-scoped tag created by
# release-tag.yml. The workflow:
# 1. Parses the component and semver from tags like amika@v1.2.3-rc.1
# 2. Builds only that component for linux/darwin on amd64 and arm64
#    (amika-hostd, a Node.js bundle, builds one platform-independent tarball)
# 3. Injects version, full commit SHA, and build date into the binary metadata
# 4. Uploads platform tarballs plus a shared checksums.txt file
# 5. Marks the GitHub Release as a prerelease when the tag contains a semver
#    prerelease suffix
#
# This workflow intentionally uses component-prefixed tags so each binary can
# be versioned independently.

on:
  push:
    tags:
      - "amika@v*"
      - "amikad@v*"
      - "amikalog@v*"
      - "amika-hostd@v*"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      release_name: ${{ steps.parse.outputs.release_name }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      commit: ${{ steps.parse.outputs.commit }}
      build_date: ${{ steps.parse.outputs.build_date }}
      binary_name: ${{ steps.parse.outputs.binary_name }}
      build_matrix: ${{ steps.parse.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            amika@*)
              component="amika"
              binary_name="amika"
              ;;
            amikad@*)
              component="amikad"
              binary_name="amikad"
              ;;
            amikalog@*)
              component="amikalog"
              binary_name="amikalog"
              ;;
            amika-hostd@*)
              component="amika-hostd"
              binary_name="amika-hostd"
              ;;
            *)
              echo "Unsupported tag format: $TAG" >&2
              exit 1
              ;;
          esac

          version="${TAG#*@}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "Tag version is not valid semver: $version" >&2
            exit 1
          fi

          commit="$(git rev-list -n 1 "$TAG")"
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          prerelease=false
          if printf '%s' "$version" | grep -q -- '-'; then
            prerelease=true
          fi

          if [ "$component" = "amikad" ]; then
            # amikad's secure state operations are Linux-only. Do not publish
            # Darwin archives that cannot configure a usable daemon.
            # TODO(KAPRO-812): Re-enable Darwin after macOS secure state support.
            build_matrix='{"include":[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"}]}'
          else
            build_matrix='{"include":[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]}'
          fi

          {
            echo "component=$component"
            echo "version=$version"
            echo "release_name=$component $version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
            echo "build_date=$build_date"
            echo "binary_name=$binary_name"
            echo "build_matrix=$build_matrix"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    if: needs.metadata.outputs.component != 'amika-hostd'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: go/go.sum
          cache: false

      - name: Build archive
        working-directory: go
        env:
          COMPONENT: ${{ needs.metadata.outputs.component }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          BINARY_NAME: ${{ needs.metadata.outputs.binary_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          case "$COMPONENT" in
            amika)
              package_path="./cmd/amika"
              ld_version="github.com/gofixpoint/amika/go/internal/buildmeta.amikaVersionValue=$VERSION"
              ;;
            amikad)
              package_path="./cmd/amikad"
              ld_version="github.com/gofixpoint/amika/go/internal/buildmeta.amikadVersionValue=$VERSION"
              ;;
            amikalog)
              package_path="./cmd/amikalog"
              ld_version="github.com/gofixpoint/amika/go/internal/buildmeta.amikalogVersionValue=$VERSION"
              ;;
            *)
              echo "Unsupported component: $COMPONENT" >&2
              exit 1
              ;;
          esac

          archive_base="${COMPONENT}_${VERSION#v}_${GOOS}_${GOARCH}"
          staging_dir="../dist/${archive_base}"
          binary_path="${staging_dir}/${BINARY_NAME}"

          mkdir -p "$staging_dir"

          env CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build \
              -trimpath \
              -ldflags="-s -w -X ${ld_version} -X github.com/gofixpoint/amika/go/internal/buildmeta.Commit=${COMMIT} -X github.com/gofixpoint/amika/go/internal/buildmeta.Date=${BUILD_DATE}" \
              -o "$binary_path" \
              "$package_path"

          tar -C "../dist" -czf "../dist/${archive_base}.tar.gz" "${archive_base}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.metadata.outputs.component }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # amika-hostd is one bundled JavaScript file, so it has no Go build matrix:
  # a single tarball serves every platform (install-amika-hostd.sh supplies Node.js).
  build-hostd:
    needs: metadata
    if: needs.metadata.outputs.component == 'amika-hostd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No `cache:` input, so setup-node does not cache: a release build never
      # restores dependencies a PR run could have poisoned. v5+ can cache
      # automatically from package.json's `packageManager` field, so
      # `package-manager-cache: false` turns that off.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build archive
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: js/amika-hostd/scripts/package-release.sh "$VERSION" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amika-hostd
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - metadata
      - build
      - build-hostd
    # Exactly one of the build jobs runs; the other is skipped.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-upload
          find release-artifacts -type f -name '*.tar.gz' -exec cp {} release-upload/ \;
          cd release-upload
          sha256sum *.tar.gz > checksums.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-upload/* --clobber
          else
            gh release create "$TAG" release-upload/* \
              --title "$RELEASE_NAME" \
              --generate-notes \
              $prerelease_flag
          fi
