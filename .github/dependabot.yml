version: 2

updates:
  # Every action is pinned to a commit SHA (enforced by zizmor's unpinned-uses
  # audit), so Dependabot is what moves those pins forward. It rewrites the SHA
  # and the trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # broken release has time to be noticed and yanked first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
